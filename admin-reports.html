<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reports | ENTRACO</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">E</span><span><strong>ENTRACO</strong><small>Enugu State Transport Company</small></span></a><nav class="main-nav"><a href="admin-dashboard.html">Operations</a><a class="active" href="admin-reports.html">Reports</a><button class="nav-login" id="logout">Log out</button></nav></header><main class="page-main"><div class="page-header"><div><p class="eyebrow">OPERATIONS REPORTS</p><h1>Network reports.</h1><p>These values are calculated from stored trips, bookings, and successful payments.</p></div></div><div class="page-stats" id="report-stats"></div><section class="table-card"><h3>Route performance</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Route</th><th>Bookings</th><th>Occupancy</th><th>Revenue</th></tr></thead><tbody id="route-report"></tbody></table></div></section></main><script src="js/site.js"></script><script>const admin=requireRole('admin');if(admin){const routes=pageStore.get('routes',[]),trips=pageStore.get('trips',[]),bookings=pageStore.get('bookings',[]),payments=pageStore.get('payments',[]);document.querySelector('#report-stats').innerHTML=[['Total bookings',bookings.length],['Completed trips',trips.filter(item=>item.status==='Completed').length],['Cancelled trips',trips.filter(item=>item.status==='Cancelled').length],['Successful revenue',pageMoney(payments.filter(item=>item.status==='Successful').reduce((sum,item)=>sum+Number(item.amount||0),0))]].map(item=>`<div class="stat-card"><small>${item[0]}</small><strong>${item[1]}</strong></div>`).join('');document.querySelector('#route-report').innerHTML=routes.length?routes.map(route=>{const matching=bookings.filter(item=>item.from===route.from&&item.to===route.to),fare=Number(route.fare||0),capacity=trips.filter(item=>item.from===route.from&&item.to===route.to).reduce((sum,item)=>sum+Number(item.capacity||0),0);return `<tr><td>${route.from} → ${route.to}</td><td>${matching.length}</td><td>${capacity?Math.round(matching.length/capacity*100)+'%':'N/A'}</td><td>${pageMoney(matching.reduce((sum,item)=>sum+(item.status==='Confirmed'?fare:0),0))}</td></tr>`}).join(''):'<tr><td colspan="4">No route data.</td></tr>';document.querySelector('#logout').addEventListener('click',logout)}</script></body></html>
