<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Assigned trips | ENTRACO</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">E</span><span><strong>ENTRACO</strong><small>Enugu State Transport Company</small></span></a><nav class="main-nav"><a href="driver-dashboard.html">Dashboard</a><a class="active" href="driver-trips.html">Assigned trips</a></nav></header><main class="page-main"><div class="page-header"><div><p class="eyebrow">DRIVER TRIP HISTORY</p><h1>Assigned trip board.</h1><p>Trips are loaded from administrator-created records.</p></div></div><section class="table-card"><table class="data-table"><thead><tr><th>Date</th><th>Route</th><th>Bus</th><th>Seats</th><th>Status</th></tr></thead><tbody id="driver-trips"></tbody></table></section></main><script src="js/site.js"></script><script>const user=requireRole('driver');if(user){const trips=pageStore.get('trips',[]).filter(item=>item.driverId===user.id);document.querySelector('#driver-trips').innerHTML=trips.length?trips.map(item=>`<tr><td>${dateLabel(item.date)}<small>${item.departure||'N/A'}</small></td><td>${item.from} → ${item.to}</td><td>${item.bus||'N/A'}</td><td>${item.bookedSeats||0}/${item.capacity}</td><td>${statusBadge(item.status)}</td></tr>`).join(''):'<tr><td colspan="5">No assigned trips.</td></tr>'}</script></body></html>
