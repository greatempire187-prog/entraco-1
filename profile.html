<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile | ENTRACO</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">E</span><span><strong>ENTRACO</strong><small>Enugu State Transport Company</small></span></a><nav class="main-nav"><a href="passenger-dashboard.html">Dashboard</a><a href="booking.html">Search trips</a><button class="nav-login" id="logout">Log out</button></nav></header><main class="page-main"><div class="page-header"><div><p class="eyebrow">PROFILE</p><h1>Your account details.</h1><p>Edit the information saved for this browser account.</p></div></div><section class="form-card" style="max-width:620px"><form id="profile-form"><label>Full name<input id="profile-name" required></label><label>Email address<input id="profile-email" type="email" required></label><label>Phone number<input id="profile-phone" type="tel"></label><button class="button" type="submit">Save profile <span>→</span></button><p id="profile-message" class="form-message success"></p></form></section></main><script src="js/site.js"></script><script>const user=requireRole();if(user){document.querySelector('#profile-name').value=user.name||'';document.querySelector('#profile-email').value=user.email||'';document.querySelector('#profile-phone').value=user.phone||'';document.querySelector('#profile-form').addEventListener('submit',event=>{event.preventDefault();const users=pageStore.get('users',[]).map(item=>item.id===user.id?{...item,name:document.querySelector('#profile-name').value,email:document.querySelector('#profile-email').value,phone:document.querySelector('#profile-phone').value}:item);pageStore.set('users',users);document.querySelector('#profile-message').textContent='Profile saved.'});document.querySelector('#logout').addEventListener('click',logout)}</script></body></html>
